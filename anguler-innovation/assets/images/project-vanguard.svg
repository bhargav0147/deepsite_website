<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#1B1736" />
    </linearGradient>
    <linearGradient id="brandGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#493CEB" />
      <stop offset="100%" stop-color="#9B8FFF" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)" rx="24"/>
  
  <circle cx="400" cy="250" r="220" fill="#493CEB" opacity="0.12" filter="url(#glow2)" />
  
  <!-- Knowledge Panel Card Representation -->
  <rect x="220" y="80" width="360" height="340" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  
  <!-- Profile Avatar Ring -->
  <circle cx="400" cy="160" r="45" fill="url(#brandGrad2)" />
  <circle cx="400" cy="160" r="52" fill="none" stroke="#9B8FFF" stroke-width="2" stroke-dasharray="6,4" />
  <path d="M 385 155 L 396 166 L 418 144" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Entity Title & Verified Badge -->
  <text x="400" y="240" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">Vanguard Executive</text>
  <text x="400" y="262" text-anchor="middle" fill="#9B8FFF" font-family="sans-serif" font-size="13" font-weight="600">VERIFIED SEARCH ENTITY</text>
  
  <!-- Citation Badges -->
  <rect x="260" y="290" width="80" height="32" rx="16" fill="rgba(255,255,255,0.08)" />
  <text x="300" y="311" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">PRESS</text>

  <rect x="360" y="290" width="80" height="32" rx="16" fill="rgba(255,255,255,0.08)" />
  <text x="400" y="311" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">SCHEMA</text>

  <rect x="460" y="290" width="80" height="32" rx="16" fill="rgba(255,255,255,0.08)" />
  <text x="500" y="311" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11">WIKIDATA</text>

  <!-- Authority Graph Connecting Nodes -->
  <circle cx="120" cy="120" r="16" fill="#493CEB" />
  <line x1="135" y1="130" x2="220" y2="160" stroke="rgba(73,60,235,0.4)" stroke-width="2" />
  
  <circle cx="680" cy="140" r="16" fill="#7669FF" />
  <line x1="665" y1="150" x2="580" y2="170" stroke="rgba(118,105,255,0.4)" stroke-width="2" />

  <circle cx="140" cy="380" r="16" fill="#7669FF" />
  <line x1="155" y1="370" x2="230" y2="340" stroke="rgba(118,105,255,0.4)" stroke-width="2" />

  <circle cx="660" cy="360" r="16" fill="#493CEB" />
  <line x1="645" y1="350" x2="570" y2="330" stroke="rgba(73,60,235,0.4)" stroke-width="2" />
</svg>
