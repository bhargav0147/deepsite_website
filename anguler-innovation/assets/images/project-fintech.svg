<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0B1F" />
      <stop offset="100%" stop-color="#1B143A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#493CEB" />
      <stop offset="100%" stop-color="#7669FF" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad4)" rx="24"/>

  <!-- Glass Credit Card Mockup -->
  <g transform="translate(180, 110) rotate(-6)">
    <rect width="360" height="220" rx="18" fill="url(#cardGrad)" opacity="0.9" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <circle cx="60" cy="50" r="16" fill="#FF5F56" opacity="0.8" />
    <circle cx="85" cy="50" r="16" fill="#FFBD2E" opacity="0.8" />
    <rect x="40" y="110" width="50" height="38" rx="6" fill="#FFD700" opacity="0.7" />
    <text x="40" y="180" fill="#FFFFFF" font-family="monospace" font-size="18" letter-spacing="4">•••• •••• •••• 9274</text>
    <text x="40" y="202" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="10">FINTECH PRO GATEWAY</text>
  </g>

  <!-- Overlapping Second Card -->
  <g transform="translate(260, 170) rotate(4)">
    <rect width="360" height="220" rx="18" fill="rgba(255,255,255,0.08)" backdrop-filter="blur(16px)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <text x="40" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold">TRANSACTIONAL API</text>
    <text x="40" y="85" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="12">INSTANT STRIPE &amp; BANK SETTLEMENT</text>
    <path d="M 40 140 Q 120 90, 200 130 T 320 110" fill="none" stroke="#00F2FE" stroke-width="4" />
    <circle cx="320" cy="110" r="6" fill="#00F2FE" />
  </g>

  <rect x="100" y="380" width="160" height="40" rx="20" fill="rgba(255,255,255,0.05)" />
  <text x="180" y="405" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">🔒 256-Bit SSL Encryption</text>
</svg>
