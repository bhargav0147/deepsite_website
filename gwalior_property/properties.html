<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties - Gwalior Property</title>
  <meta name="description" content="Browse all properties for sale and rent in Gwalior. Filter by type, purpose, price, and location.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header id="main-header"></header>

  <!-- Page Hero -->
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span>/</span>
        <span class="current">Properties</span>
      </div>
      <h1>All Properties</h1>
      <p>Explore the best properties available for sale and rent in Gwalior.</p>
    </div>
  </section>

  <!-- Properties Section -->
  <section class="section">
    <div class="container">
      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="filter-row">
          <div class="filter-group">
            <label>Purpose</label>
            <select id="filter-purpose" onchange="currentFilters.purpose=this.value;filterProperties()">
              <option value="All">All</option>
              <option value="Sell">Buy (For Sale)</option>
              <option value="Rent">Rent</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Property Type</label>
            <select id="filter-type" onchange="currentFilters.type=this.value;filterProperties()">
              <option value="All">All</option>
              <option value="Residential">Residential</option>
              <option value="Commercial">Commercial</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Price Range</label>
            <select id="filter-price" onchange="currentFilters.priceRange=this.value;filterProperties()">
              <option value="All">All Prices</option>
              <optgroup label="Buy (Sale)">
                <option value="under-25lac">Under ₹25 Lac</option>
                <option value="25-50lac">₹25 Lac - ₹50 Lac</option>
                <option value="50-1cr">₹50 Lac - ₹1 Cr</option>
                <option value="1-2cr">₹1 Cr - ₹2 Cr</option>
                <option value="above-2cr">Above ₹2 Cr</option>
              </optgroup>
              <optgroup label="Rent (Monthly)">
                <option value="under-15k">Under ₹15,000</option>
                <option value="15-30k">₹15,000 - ₹30,000</option>
                <option value="30-50k">₹30,000 - ₹50,000</option>
                <option value="above-50k">Above ₹50,000</option>
              </optgroup>
            </select>
          </div>
          <div class="filter-group">
            <label>Location</label>
            <select id="filter-location" onchange="currentFilters.location=this.value;filterProperties()">
              <option value="All">All Locations</option>
              <option value="City Centre">City Centre</option>
              <option value="Morar">Morar</option>
              <option value="Thatipur">Thatipur</option>
              <option value="Mahalgaon">Mahalgaon</option>
              <option value="Lashkar">Lashkar</option>
              <option value="Gole Ka Mandir">Gole Ka Mandir</option>
              <option value="Sirol">Sirol</option>
              <option value="Airport Road">Airport Road</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Search</label>
            <input type="text" id="filter-search" placeholder="Search by name, location..." oninput="searchProperties(this.value)">
          </div>
        </div>
      </div>

      <!-- Property Count -->
      <p class="property-count" id="property-count">Loading...</p>

      <!-- Properties Grid -->
      <div class="properties-grid" id="properties-grid">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="main-footer"></footer>

</body>
